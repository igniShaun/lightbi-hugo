{{ define "main" }}
<div class="col-lg-8 offset-lg-2 col-md-10 col-sm-12 offset-md-1 pt-4">
  <center>{{ .Content }}
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <div class="container">
    <!-- The form below is valid, you can add or delete fields as you want -->
    <!-- Please make sure that each form element has name="" attribute like the example below -->
    <form action="https://formcarry.com/s/OjtHQDHeY0E" method="POST" enctype="multipart/form-data">
      <br>
      <div class="row">
        <div class="col"></div>
        <div class="formcarry-block">
          <label for="fc-generated-1-name" class="col-lg-3 col-md-4 col-sm-4 align-top">Full Name &nbsp; &nbsp; &nbsp;</label>
          <input type="text" name="name" id="fc-generated-1-name" placeholder="Your first and last name" class="col-lg-5 col-md-6 col-sm-5" />
        </div>
        <div class="col"></div>
      </div>

      <br>
      <div class="row">
        <div class="col"></div>
        <div class="formcarry-block">
          <label for="fc-generated-1-email" class="col-lg-3 col-md-4 col-sm-4 align-top">Email Address</label>
          <input type="email" name="email" id="fc-generated-1-email" placeholder="john@doe.com" class="col-lg-5 col-md-6 col-sm-5" />
        </div>
        <div class="col"></div>
      </div>

      <br>
      <div class="row">
        <div class="col"></div>
        <div class="formcarry-block">
          <label for="fc-generated-1-message" class="col-lg-3 col-md-4 col-sm-4 align-top">Your message</label>
          <textarea name="message" name="message" id="fc-generated-1-message" placeholder="Enter your message..." class="col-lg-5 col-md-6 col-sm-5"></textarea>
        </div>
        <div class="col"></div>
      </div>

      <br>
      <!-- REQUIRED FOR HCAPTCHA -->
      <!-- REPLACE YOUR SITE KEY BELOW -->
      <div class="row">
        <div class="col"></div>
        <div class="h-captcha col-lg-8 col-md-9 col-sm-11" data-sitekey="e8b8519c-905a-4138-bbda-de66b108ec88"></div>
        <div class="col-lg-2"></div>
      </div>
  
      <br>
      <div class="row">
        <div class="col"></div>
        <div class="formcarry-block col-lg-8 col-md-10 col-sm-9">  
          <button type="submit">Send</button>
        </div>
        <div class="col"></div>
      </div>
    
    </form>
  </div></center>
</div>

{{ end }}
